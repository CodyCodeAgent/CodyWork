<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodyWork · 服务器连接</title>
  <link rel="stylesheet" href="settings.css">
  <script type="module" src="settings.js"></script>
</head>
<body>
  <main>
    <header class="intro">
      <img src="codywork.svg" width="44" height="44" alt="">
      <div>
        <h1>服务器连接</h1>
        <p>连接一台运行 CodyWork 的开发机。</p>
      </div>
      <button id="about-updates" class="about-updates" type="button">关于与更新</button>
    </header>
    <p id="status" class="feedback" role="status" hidden></p>
    <section id="saved" aria-labelledby="saved-title" hidden>
      <div class="section-heading">
        <h2 id="saved-title">已保存的服务器</h2>
        <button id="add-server" type="button">添加服务器</button>
      </div>
      <ul id="servers"></ul>
    </section>
    <section id="editor" class="panel" aria-labelledby="form-title" hidden>
      <h2 id="form-title">添加服务器</h2>
      <form id="server-form">
        <fieldset id="fields">
          <label for="server-name">连接名称</label>
          <input id="server-name" name="name" placeholder="例如 CN 开发机" maxlength="64" required>
          <label for="server-address">CodyWork 地址</label>
          <input id="server-address" name="address" placeholder="http://192.168.1.10:3001"
            autocapitalize="off" spellcheck="false" inputmode="url" maxlength="2048" required
            aria-describedby="address-help">
          <p id="address-help" class="muted">填写根地址，可带端口。公网服务器使用 HTTPS。</p>
        </fieldset>
        <p id="form-feedback" class="feedback" role="status" hidden></p>
        <div class="actions">
          <button id="test-server" type="button">测试连接</button>
          <button id="cancel-edit" type="button" hidden>取消</button>
          <button id="save-server" class="primary" type="submit">保存并打开</button>
        </div>
      </form>
    </section>
    <dialog id="remove-dialog" aria-labelledby="remove-title">
      <form method="dialog">
        <h2 id="remove-title">移除服务器连接？</h2>
        <p id="remove-name"></p>
        <div class="actions">
          <button value="cancel" autofocus>取消</button>
          <button value="remove" class="danger">移除连接</button>
        </div>
      </form>
    </dialog>
  </main>
</body>
</html>
