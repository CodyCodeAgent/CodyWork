name: Package CodyWork for macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.100.0

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: apps/workbench-desktop
    steps:
      - name: Check out CodyWork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Rust targets
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin

      - name: Test desktop client
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build universal application
        run: npx --yes @tauri-apps/cli@2.12.5 build --ci --bundles app --target universal-apple-darwin -- --locked

      - name: Archive and verify the application
        id: package
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/CodyWork.app"
          archive="$RUNNER_TEMP/CodyWork-macos-universal-${GITHUB_SHA:0:12}-${GITHUB_RUN_ATTEMPT}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"

          extracted="$(mktemp -d "$RUNNER_TEMP/codywork-verify.XXXXXXXX")"
          ditto -x -k "$archive" "$extracted"
          executable="$extracted/CodyWork.app/Contents/MacOS/codywork-desktop"
          test -x "$executable"
          xcrun lipo "$executable" -verify_arch arm64 x86_64
          codesign --verify --strict --all-architectures "$extracted/CodyWork.app"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Upload the distributable ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 30
