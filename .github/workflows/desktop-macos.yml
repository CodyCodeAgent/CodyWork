name: Package CodyWork for macOS

on:
  push:
    branches: [main]
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.100.0

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: apps/workbench-desktop
    steps:
      - name: Check out CodyWork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Rust targets
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin

      - name: Test desktop client
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Verify desktop release points to main
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Configure the updater
        env:
          CODYWORK_DESKTOP_UPDATER_PUBLIC_KEY: ${{ vars.CODYWORK_DESKTOP_UPDATER_PUBLIC_KEY }}
        run: node scripts/update-release.mjs config "$RUNNER_TEMP/desktop-config.json"

      - name: Build universal application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: npx --yes @tauri-apps/cli@2.12.5 build --ci --bundles app --target universal-apple-darwin --config "$RUNNER_TEMP/desktop-config.json" -- --locked

      - name: Archive and verify the application
        id: package
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/CodyWork.app"
          archive="$RUNNER_TEMP/CodyWork-macos-universal-${GITHUB_SHA:0:12}-${GITHUB_RUN_ATTEMPT}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"

          extracted="$(mktemp -d "$RUNNER_TEMP/codywork-verify.XXXXXXXX")"
          ditto -x -k "$archive" "$extracted"
          executable="$extracted/CodyWork.app/Contents/MacOS/codywork-desktop"
          test -x "$executable"
          xcrun lipo "$executable" -verify_arch arm64 x86_64
          codesign --verify --strict --all-architectures "$extracted/CodyWork.app"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Upload the distributable ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Assemble the GitHub release files
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          CODYWORK_DESKTOP_UPDATER_PUBLIC_KEY: ${{ vars.CODYWORK_DESKTOP_UPDATER_PUBLIC_KEY }}
          DESKTOP_ZIP: ${{ steps.package.outputs.archive }}
        run: |
          node scripts/update-release.mjs assets "$RUNNER_TEMP/desktop-release" \
            src-tauri/target/universal-apple-darwin/release/bundle/macos "$DESKTOP_ZIP"

      - name: Upload signed release files for publishing
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release
          overwrite: true
          path: ${{ runner.temp }}/desktop-release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: macos
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the signed build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-release
          path: release

      - name: Publish the desktop release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          assets=(release/CodyWork-macos-*.zip release/CodyWork.app.tar.gz release/CodyWork.app.tar.gz.sig release/latest.json)
          if draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"; then
            if [[ "$draft" == 'false' ]]; then
              echo "Release $tag is already published."
              exit 0
            fi
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --draft --title "CodyWork Desktop ${tag#desktop-}" --notes-file release/release-notes.md
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
